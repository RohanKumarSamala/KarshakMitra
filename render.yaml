services:
  - type: web
    name: karshak-mitra
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: WEATHER_API_KEY
        sync: false   # You will set this manually in Render dashboard
    plan: free
