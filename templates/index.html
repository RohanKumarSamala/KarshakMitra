<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarshakMitra — AI Crop Disease Detection</title>
<meta name="description" content="KarshakMitra uses AI to instantly detect crop diseases from a photo.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0c0c0f;
  --surface:#13131a;
  --surface2:#1a1a24;
  --border:rgba(255,255,255,0.06);
  --accent:#4ade80;
  --accent-dim:rgba(74,222,128,0.12);
  --accent-glow:rgba(74,222,128,0.25);
  --text:#f1f5f9;
  --muted:#64748b;
  --muted2:#94a3b8;
}
html,body{height:100%;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

/* SHELL */
.shell{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.5rem;
  position:sticky;top:0;z-index:100;
  background:rgba(12,12,15,0.85);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.wordmark{
  font-family:'Outfit',sans-serif;
  font-weight:900;
  font-size:1.3rem;
  letter-spacing:-0.8px;
}
.wordmark .k{color:var(--accent);}
.wordmark .m{color:var(--text);}
.lang-select{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--muted2);
  border-radius:8px;
  padding:0.35rem 0.7rem;
  font-size:0.78rem;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  outline:none;
  transition:border-color 0.2s,color 0.2s;
}
.lang-select:focus{border-color:var(--accent);color:var(--text);}

/* HERO */
.hero{
  padding:3rem 1.5rem 2.5rem;
  position:relative;
  overflow:hidden;
}
.hero-glow{
  position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:320px;height:320px;
  background:radial-gradient(circle,rgba(74,222,128,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-dim);
  border:1px solid rgba(74,222,128,0.2);
  border-radius:99px;
  padding:0.3rem 0.85rem;
  font-size:0.73rem;
  font-weight:600;
  color:var(--accent);
  letter-spacing:0.4px;
  margin-bottom:1.4rem;
}
.pulse-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pd 2s infinite;}
@keyframes pd{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.5);}}
.hero h1{
  font-family:'Outfit',sans-serif;
  font-size:clamp(2rem,7vw,2.8rem);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-1.5px;
  margin-bottom:0.9rem;
  color:var(--text);
}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero p{
  font-size:0.9rem;
  line-height:1.75;
  color:var(--muted2);
  max-width:340px;
  margin-bottom:2rem;
}
.stats-row{display:flex;gap:0;}
.stat-item{
  flex:1;
  text-align:center;
  padding:1rem 0;
  border:1px solid var(--border);
  background:var(--surface);
}
.stat-item:first-child{border-radius:12px 0 0 12px;}
.stat-item:last-child{border-radius:0 12px 12px 0;}
.stat-item:not(:first-child){border-left:none;}
.stat-num{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;color:var(--accent);}
.stat-lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

/* MAIN */
.main{flex:1;padding:0 1.2rem 100px;}
.page{display:none;animation:fi 0.3s ease;}
.page.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* SCAN SECTION */
.section-label{
  font-size:0.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);
  margin-bottom:0.9rem;
}
.scan-stack{display:flex;flex-direction:column;gap:0.75rem;}

/* PRIMARY BTN — full bleed gradient */
.btn-scan{
  width:100%;
  border:none;
  border-radius:14px;
  padding:1.1rem 1.3rem;
  display:flex;align-items:center;gap:1rem;
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  font-size:0.92rem;
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
  text-align:left;
  position:relative;
  overflow:hidden;
}
.btn-scan:active{transform:scale(0.975);}
.btn-primary{
  background:linear-gradient(135deg,#4ade80 0%,#22c55e 100%);
  color:#052e16;
  box-shadow:0 4px 24px rgba(74,222,128,0.2);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(74,222,128,0.35);}
.btn-secondary{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{border-color:rgba(74,222,128,0.3);background:var(--surface2);transform:translateY(-2px);}
.btn-icon-wrap{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.btn-primary .btn-icon-wrap{background:rgba(5,46,22,0.25);}
.btn-secondary .btn-icon-wrap{background:var(--accent-dim);}
.btn-primary .btn-icon-wrap svg{stroke:#052e16;}
.btn-secondary .btn-icon-wrap svg{stroke:var(--accent);}
.btn-icon-wrap svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-label{font-size:0.92rem;font-weight:600;display:block;}
.btn-sub{font-size:0.74rem;font-weight:400;opacity:0.65;display:block;margin-top:1px;}

/* BOTTOM NAV */
.bottom-nav{
  position:sticky;bottom:0;
  background:rgba(12,12,15,0.95);
  backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:0.55rem 0 calc(0.55rem + env(safe-area-inset-bottom));
  z-index:100;
}
.nav-btn{
  background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:0.45rem 1.5rem;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:0.68rem;font-weight:500;
  cursor:pointer;
  transition:color 0.2s;
  border-radius:10px;
}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;margin-bottom:1px;}
.nav-btn.active{color:var(--accent);}
.nav-indicator{width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity 0.2s;}
.nav-btn.active .nav-indicator{opacity:1;}

/* HISTORY */
.history-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface);}
.history-item{display:flex;align-items:center;gap:0.9rem;padding:0.9rem 1.1rem;border-bottom:1px solid var(--border);transition:background 0.15s;}
.history-item:last-child{border-bottom:none;}
.history-item:hover{background:var(--surface2);}
.h-thumb{width:50px;height:50px;border-radius:9px;object-fit:cover;flex-shrink:0;}
.h-crop{font-weight:600;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-meta{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.empty-state{padding:3rem 1rem;text-align:center;color:var(--muted);}
.empty-state .e-icon{font-size:2rem;margin-bottom:0.75rem;opacity:0.4;}
.empty-state p{font-size:0.85rem;line-height:1.6;}
.section-heading{font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1rem;color:var(--text);}

/* RESULTS */
.result-img{width:100%;height:220px;object-fit:cover;border-radius:16px;margin-bottom:1.1rem;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.3rem;}
.result-title{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:0.25rem;}
.result-meta{font-size:0.82rem;color:var(--muted);margin-bottom:1rem;}
.conf-track{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:1.2rem;}
.conf-fill{height:100%;background:linear-gradient(90deg,var(--accent),#86efac);border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.tabs{display:flex;gap:0.25rem;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:1.1rem;}
.tab{flex:1;padding:0.55rem;border-radius:8px;text-align:center;font-size:0.78rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.tab.active{background:var(--accent);color:#052e16;}
.tab-content{display:none;font-size:0.875rem;line-height:1.8;color:var(--muted2);}
.tab-content.active{display:block;animation:fi 0.2s ease;}
.tab-content h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:0.5rem;}
.back-btn{
  display:inline-flex;align-items:center;gap:0.4rem;
  background:none;border:1px solid var(--border);
  color:var(--muted2);border-radius:9px;
  padding:0.45rem 0.9rem;
  font-family:'DM Sans',sans-serif;font-size:0.82rem;
  cursor:pointer;margin-bottom:1rem;
  transition:border-color 0.2s,color 0.2s;
}
.back-btn:hover{border-color:rgba(74,222,128,0.3);color:var(--accent);}

/* CAMERA MODAL */
#camera-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:200;display:none;justify-content:center;align-items:center;}
#camera-view{position:relative;width:92%;max-width:430px;}
#camera-stream{width:100%;border-radius:18px;}
#capture-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,0.8);background:var(--accent);cursor:pointer;box-shadow:0 0 24px var(--accent-glow);}
#close-camera-btn{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#file-input{display:none;}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:1rem;}
.loader-ring{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader p{font-size:0.88rem;color:var(--muted);}
</style>
</head>
<body>
<div class="shell">

<header class="topbar">
  <div class="wordmark"><span class="k">Karshak</span><span class="m">Mitra</span></div>
  <select class="lang-select" id="language-selector">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="te">తెలుగు</option>
  </select>
</header>

<section class="hero" id="hero-section">
  <div class="hero-glow"></div>
  <div class="hero-pill"><span class="pulse-dot"></span>AI · Real-Time</div>
  <h1>Detect Crop<br>Disease <em>Instantly</em></h1>
  <p>Snap a photo of any leaf. Our AI identifies the disease and gives you expert treatment advice in seconds.</p>
  <div class="stats-row">
    <div class="stat-item"><div class="stat-num">38+</div><div class="stat-lbl">Crops</div></div>
    <div class="stat-item"><div class="stat-num">95%</div><div class="stat-lbl">Accuracy</div></div>
    <div class="stat-item"><div class="stat-num">3s</div><div class="stat-lbl">Scan Time</div></div>
  </div>
</section>

<main class="main">
  <div id="dashboard-page" class="page active">
    <div class="section-label" data-key="new_scan">New Scan</div>
    <div class="scan-stack">
      <button id="camera-btn" class="btn-scan btn-primary">
        <span class="btn-icon-wrap">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="3"/><circle cx="12" cy="14" r="3"/><path d="M8 7l1.5-3h5L16 7"/></svg>
        </span>
        <span>
          <span class="btn-label" data-key="live_camera">Live Camera</span>
          <span class="btn-sub">Capture a photo now</span>
        </span>
      </button>
      <button id="upload-btn" class="btn-scan btn-secondary">
        <span class="btn-icon-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </span>
        <span>
          <span class="btn-label" data-key="upload_image">Upload Image</span>
          <span class="btn-sub">From your gallery</span>
        </span>
      </button>
      <input type="file" id="file-input" accept="image/*">
    </div>
  </div>

  <div id="history-page" class="page">
    <div class="section-heading" data-key="scan_history">Scan History</div>
    <div class="history-wrap" id="history-list">
      <div class="empty-state">
        <div class="e-icon">🌿</div>
        <p data-key="history_placeholder">Your last 5 scans will appear here.</p>
      </div>
    </div>
  </div>

  <div id="results-page" class="page"></div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="dashboard-page" id="nav-home">
    <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
    <span data-key="nav_dashboard">Home</span>
    <span class="nav-indicator"></span>
  </button>
  <button class="nav-btn" data-page="history-page" id="nav-history">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span data-key="nav_history">History</span>
    <span class="nav-indicator"></span>
  </button>
</nav>

</div>

<div id="camera-modal">
  <div id="camera-view">
    <video id="camera-stream" autoplay playsinline></video>
    <button id="capture-btn"></button>
    <button id="close-camera-btn">✕</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const langSelector = document.getElementById('language-selector');
  const cameraModal = document.getElementById('camera-modal');
  const cameraStream = document.getElementById('camera-stream');
  const captureBtn = document.getElementById('capture-btn');
  const closeCameraBtn = document.getElementById('close-camera-btn');
  const fileInput = document.getElementById('file-input');

  const translations = {
    hi: { new_scan:"नया स्कैन", live_camera:"लाइव कैमरा", upload_image:"छवि अपलोड करें", scan_history:"स्कैन इतिहास", history_placeholder:"आपके अंतिम 5 स्कैन यहां दिखाई देंगे।", overview:"अवलोकन", prevention:"निवारण", treatment:"उपचार", description:"विवरण", prevention_steps:"निवारण चरण", treatment_advice:"उपचार सलाह", nav_dashboard:"होम", nav_history:"इतिहास" },
    te: { new_scan:"కొత్త స్కాన్", live_camera:"లైవ్ కెమెరా", upload_image:"చిత్రం అప్‌లోడ్", scan_history:"స్కాన్ చరిత్ర", history_placeholder:"మీ చివరి 5 స్కాన్‌లు ఇక్కడ కనిపిస్తాయి.", overview:"అవలోకనం", prevention:"నివారణ", treatment:"చికిత్స", description:"వివరణ", prevention_steps:"నివారణ చర్యలు", treatment_advice:"చికిత్స సలహా", nav_dashboard:"హోమ్", nav_history:"చరిత్ర" }
  };

  function setLanguage(lang) {
    document.querySelectorAll('[data-key]').forEach(el => {
      if (!el.dataset.orig) el.dataset.orig = el.textContent;
      el.textContent = (lang === 'en') ? el.dataset.orig : (translations[lang]?.[el.dataset.key] || el.dataset.orig);
    });
  }
  langSelector.addEventListener('change', e => setLanguage(e.target.value));

  const navBtns = document.querySelectorAll('.nav-btn');
  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
    if (pageId !== 'results-page') document.getElementById('hero-section').style.display = '';
  }
  navBtns.forEach(btn => btn.addEventListener('click', () => {
    showPage(btn.dataset.page);
    if (btn.dataset.page === 'history-page') loadHistory();
  }));

  function loadHistory() {
    const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = `<div class="empty-state"><div class="e-icon">🌿</div><p data-key="history_placeholder">Your last 5 scans will appear here.</p></div>`;
      setLanguage(langSelector.value); return;
    }
    list.innerHTML = history.map(item => `
      <div class="history-item">
        <img src="${item.image}" class="h-thumb" alt="scan">
        <div>
          <div class="h-crop">${item.crop}: ${item.disease}</div>
          <div class="h-meta">${new Date(item.date).toLocaleString()} · ${(item.confidence*100).toFixed(1)}% confidence</div>
        </div>
      </div>`).join('');
  }
  function saveHistory(item) {
    let h = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    h.unshift(item); h = h.slice(0, 5);
    localStorage.setItem('scanHistory', JSON.stringify(h));
  }

  let stream;
  document.getElementById('camera-btn').addEventListener('click', async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
      cameraStream.srcObject = stream;
      cameraModal.style.display = 'flex';
    } catch { alert('Camera permission denied.'); }
  });
  closeCameraBtn.addEventListener('click', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    cameraModal.style.display = 'none';
  });
  captureBtn.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = cameraStream.videoWidth; canvas.height = cameraStream.videoHeight;
    canvas.getContext('2d').drawImage(cameraStream, 0, 0);
    canvas.toBlob(blob => handleFile(blob), 'image/jpeg');
    closeCameraBtn.click();
  });
  document.getElementById('upload-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  async function handleFile(file) {
    if (!file) return;
    document.getElementById('hero-section').style.display = 'none';
    showPage('results-page');
    document.getElementById('results-page').innerHTML = `<div class="loader"><div class="loader-ring"></div><p>Analyzing your crop…</p></div>`;
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
      const imageDataUrl = reader.result;
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch('/predict', { method:'POST', body:formData });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        displayResults(data, imageDataUrl);
        saveHistory({...data, image:imageDataUrl, date:new Date()});
      } catch {
        alert('Prediction failed. Please try again.');
        document.getElementById('hero-section').style.display = '';
        showPage('dashboard-page');
      }
    };
  }

  function displayResults(data, imageUrl) {
    const pct = (data.confidence * 100).toFixed(1);
    const healthy = data.disease.toLowerCase().includes('healthy');
    document.getElementById('results-page').innerHTML = `
      <button class="back-btn" id="back-btn">← Back</button>
      <img src="${imageUrl}" class="result-img" alt="crop">
      <div class="result-card">
        <div class="result-title">${healthy ? '✅' : '⚠️'} ${data.disease}</div>
        <div class="result-meta">Crop: <strong style="color:var(--text)">${data.crop}</strong> &nbsp;·&nbsp; Confidence: <strong style="color:var(--accent)">${pct}%</strong></div>
        <div class="conf-track"><div class="conf-fill" style="width:${pct}%"></div></div>
        <div class="tabs">
          <div class="tab active" data-tab="ov" data-key="overview">Overview</div>
          <div class="tab" data-tab="pv" data-key="prevention">Prevention</div>
          <div class="tab" data-tab="tr" data-key="treatment">Treatment</div>
        </div>
        <div id="ov" class="tab-content active"><h3 data-key="description">Description</h3><p>${data.description}</p></div>
        <div id="pv" class="tab-content"><h3 data-key="prevention_steps">Prevention Steps</h3><p>${data.prevention}</p></div>
        <div id="tr" class="tab-content"><h3 data-key="treatment_advice">Treatment Advice</h3><p>${data.treatment}</p></div>
      </div>`;
    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('hero-section').style.display = '';
      showPage('dashboard-page');
    });
    document.querySelectorAll('#results-page .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#results-page .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('#results-page .tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });
    setLanguage(langSelector.value);
  }

  loadHistory();
  document.querySelectorAll('[data-key]').forEach(el => el.dataset.orig = el.textContent);
});
</script>
